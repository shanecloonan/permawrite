[package]
name = "mfn-airgap"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Air-gapped wallet signing. The spend seed never leaves the offline machine."

[lib]
name = "mfn_airgap"
path = "src/lib.rs"

[[bin]]
name = "mfn-airgap"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
hex = { workspace = true }
mfn-crypto = { path = "../../mfn-crypto" }
mfn-wallet = { path = "../../mfn-wallet", default-features = false }
thiserror = { workspace = true }
