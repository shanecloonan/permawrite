[package]
name = "mfn-boot-check"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Check a node unit and env before boot. Tor-only, loopback binds, no clearnet dial."

[lib]
name = "mfn_boot_check"
path = "src/lib.rs"

[[bin]]
name = "mfn-boot-check"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
thiserror = { workspace = true }
