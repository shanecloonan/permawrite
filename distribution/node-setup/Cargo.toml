[workspace]

[package]
name = "mfn-node-setup"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
publish = false
description = "Generate a Tor-only Permawrite node unit that cannot open a clearnet socket."

[[bin]]
name = "mfn-node-setup"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
