# libFuzzer for untrusted decoders. Not part of pull_request CI.
# The schedule and a manual dispatch are the only triggers.
name: Fuzz

on:
  schedule:
    # 07:30 UTC, after the 06:00 Nightly rehearsal.
    - cron: "30 7 * * *"
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libfuzzer:
    name: libFuzzer decode targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run each target for 60 seconds
        env:
          CC: gcc
          CXX: g++
        run: |
          set -euo pipefail
          for target in tx_decode block_decode header_decode codec_decode; do
            echo "fuzzing ${target}"
            cargo +nightly fuzz run "${target}" -- -max_total_time=60
          done
