[package]
name = "mfn-source-bundle"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Deterministic ustar source bundles. Two packs of the same files are byte-identical."

[lib]
name = "mfn_source_bundle"
path = "src/lib.rs"

[[bin]]
name = "mfn-source-bundle"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
sha2 = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
