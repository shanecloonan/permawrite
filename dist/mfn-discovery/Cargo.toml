[package]
name = "mfn-discovery"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "A signed card of onion gateways and magnets, so the software can be found without a domain."

[lib]
name = "mfn_discovery"
path = "src/lib.rs"

[[bin]]
name = "mfn-discovery"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
hex = { workspace = true }
mfn-crypto = { path = "../../mfn-crypto" }
thiserror = { workspace = true }
