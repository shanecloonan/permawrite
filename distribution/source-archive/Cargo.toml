[workspace]

[package]
name = "mfn-source-archive"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
publish = false
description = "Deterministic ustar archives so two people pack the same tree to the same bytes."

[[bin]]
name = "mfn-source-archive"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
