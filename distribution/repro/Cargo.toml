[workspace]

[package]
name = "mfn-repro"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
publish = false
description = "Reproducible-build profile and hash comparison for Permawrite release binaries."

[[bin]]
name = "mfn-repro"
path = "src/main.rs"

[dependencies]
hex = "0.4"
sha2 = "0.10"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
