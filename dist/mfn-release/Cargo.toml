[package]
name = "mfn-release"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Multi-maintainer signatures for Permawrite release manifests."

[lib]
name = "mfn_release"
path = "src/lib.rs"

[[bin]]
name = "mfn-release"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
mfn-crypto = { path = "../../mfn-crypto" }
hex = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
